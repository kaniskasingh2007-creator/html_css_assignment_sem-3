<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: grid;
  grid-template-columns: 200px 1fr;
  grid-template-areas:
    'header header'
    'sidebar main'
    'footer footer';
  gap: 10px;
  min-height: 100vh;
}
header { grid-area: header; background: lightblue; }
.sidebar { grid-area: sidebar; background: lightcoral; }
main { grid-area: main; background: lightgreen; }
footer { grid-area: footer; background: lightblue; }
</style>
</head>
<body>
<div class='container'>
<header>Header</header>
<div class='sidebar'>Sidebar</div>
<main>Main Area</main>
<footer>Footer</footer>
</div>
</body>
</html>
